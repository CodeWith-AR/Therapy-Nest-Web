<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Therapy Nest</title>
  <meta name="theme-color" content="#FAF9F5">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/app-logo.png">
  <link rel="apple-touch-icon" href="assets/images/app-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh;">

  <!-- Header -->
  <header class="c-header" role="banner">
    <div class="l-container c-header__inner">
      <a href="index.html" class="c-logo" aria-label="Therapy Nest Home">
        <img src="assets/images/app-logo.png" alt="Therapy Nest App Logo" class="c-logo__img" width="36" height="36">
        <span class="c-logo__text">Therapy Nest</span>
      </a>
      <a href="index.html" class="btn btn--secondary">Return Home</a>
    </div>
  </header>

  <!-- 404 Main -->
  <main class="l-section surface--canvas text-center">
    <div class="l-container l-container--text">
      <span class="badge badge--coral" style="margin-bottom: var(--space-md); font-size: 1rem; padding: 0.5rem 1rem;">404 Error</span>
      <h1 style="font-size: clamp(3rem, 6vw, 4.5rem);">Page Not Found</h1>
      <p class="text-lead" style="margin-bottom: var(--space-xl);">
        The page you are looking for might have been moved, renamed, or is temporarily unavailable.
      </p>
      <div class="btn-group" style="justify-content: center;">
        <a href="index.html" class="btn btn--primary btn--lg">Back to Homepage</a>
        <a href="support.html" class="btn btn--secondary btn--lg">Visit Help Center</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="c-footer" role="contentinfo">
    <div class="l-container">
      <div class="c-footer__bottom" style="border-top: none; padding-top: 0; justify-content: center;">
        <div>&copy; 2026 Therapy Nest Project. MIT Open Source License.</div>
      </div>
    </div>
  </footer>

</body>
</html>
